name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test
      - name: Test the Python helpers
        run: python3 -m unittest discover -s integrations/python -v
      - name: Build the app
        run: scripts/build-app.sh --zip
      - uses: actions/upload-artifact@v7
        with:
          name: tinySA-Screen
          path: build/tinySA-Screen-*.zip
