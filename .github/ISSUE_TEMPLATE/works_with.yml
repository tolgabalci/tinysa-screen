name: It works (or doesn't) with my tinySA or NanoVNA
description: Tell us how tinySA Screen gets on with a model or firmware version
labels: [compatibility]
body:
  - type: input
    id: model
    attributes:
      label: Model
      placeholder: tinySA ULTRA ZS405, the original tinySA, NanoVNA-H4
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware
      placeholder: v1.4-252, or NanoVNA-D 1.2.52
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: How it went
      options:
        - Works
        - Works, with a problem (below)
        - Doesn't work (below)
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
